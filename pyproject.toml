[project]
name = "university-schedule-bot"
version = "1.0.0"
description = "Telegram bot for university schedules and change notifications"
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.12,<4",
  "aiogram>=3.20,<4",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: tests requiring the public Yandex Disk API"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/config.py", "app/bot/handlers.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
